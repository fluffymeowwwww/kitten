<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ebd8">
  <title>猫咪，等一个家 · 同创汇猫咪守护计划</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cover">
    <header class="masthead">
      <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11 3 3l6 3h6l6-3-2 8v5c0 7-14 7-14 0z"/><path d="M8 13h.01M16 13h.01M10 17l2 1 2-1"/></svg>同创汇猫咪故事馆</span>
      <span class="edition">VOL. 01 / 秋日来信</span>
    </header>

    <section class="hero" aria-labelledby="cover-title">
      <p class="hero-label">距离同创汇拆迁，还有</p>
      <div class="hero-count">
        <b id="days-left">—</b><em>天</em>
        <span class="side-note"><span>同创汇</span><span>猫咪守护计划</span><i>一起，把故事续下去</i></span>
      </div>
      <h1 id="cover-title">猫咪，<br>等一个<span class="home-word">家<svg viewBox="0 0 62 11" aria-hidden="true"><path d="M2 8Q27 1 58 4M9 10.5Q31 5 52 7.5"/></svg></span></h1>
      <p class="hero-sub">TA 们还不知道，家要没了。</p>
    </section>

    <figure class="scene" aria-label="暖阳下的街角，橘白猫和伙伴们安静地相伴">
      <img class="scene-slice" src="assets/scene-top.webp" width="1024" height="320" alt="" fetchpriority="high">
      <img class="scene-slice" src="assets/scene-cats.webp" width="1024" height="480" alt="" fetchpriority="high">
      <img class="scene-slice" src="assets/scene-ground.webp" width="1024" height="224" alt="">
      <figcaption>在这里，每一只猫都有名字。</figcaption>
    </figure>

    <section class="invitation" aria-label="猫咪故事入口">
      <p class="context">拆迁之前，<strong>让它们先被看见。</strong></p>
      <!-- 版本2 故事馆内页开发中，暂不跳转 -->
      <a class="enter" href="#" aria-disabled="true"><span>翻开它们的故事</span><svg viewBox="0 0 42 22" aria-hidden="true"><path d="M1 11h37M29 2l10 9-10 9"/></svg></a>
      <p class="closing"><span>遇见 · 记住 · 守护</span><span>愿每一场相遇，都通向一个家</span></p>
    </section>
  </main>
  <script src="cover.js"></script>
</body>
</html>
